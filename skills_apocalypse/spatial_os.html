<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apocalypse Spatial OS</title>
<link rel="stylesheet" href="/spatial_os.css">
<style>
.scale-control{position:relative;width:38px!important;font-weight:600;letter-spacing:-.04em}.ui-scale-menu{position:fixed;z-index:55;top:51px;right:52px;display:none;align-items:center;gap:3px;padding:5px;border:1px solid var(--hair);border-radius:10px;background:rgba(13,18,25,.96);box-shadow:0 16px 45px rgba(0,0,0,.35)}.ui-scale-menu.open{display:flex}.ui-scale-menu button{min-width:42px;height:30px;padding:0 7px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--mute);font:9px Consolas,monospace;cursor:pointer}.ui-scale-menu button:hover{background:rgba(255,255,255,.04);color:var(--ink)}.ui-scale-menu button.active{border-color:rgba(111,148,184,.3);background:rgba(111,148,184,.1);color:var(--ink);box-shadow:0 0 16px rgba(111,148,184,.07)}.scale-control[data-scale]:after{content:attr(data-scale);position:absolute;right:-5px;bottom:-4px;padding:1px 3px;border-radius:4px;background:#111821;color:var(--cyan);font:7px Consolas,monospace;letter-spacing:0}.space-back-hint{position:fixed;left:50%;bottom:56px;z-index:8;pointer-events:none;opacity:0;transform:translate(-50%,8px);transition:opacity .25s,transform .25s;padding:5px 9px;border:1px solid rgba(255,255,255,.05);border-radius:7px;background:rgba(11,16,22,.42);color:rgba(184,189,194,.7);font:9px Consolas,monospace;letter-spacing:.07em}.space-back-hint.show{opacity:1;transform:translate(-50%,0)}.repair-status{margin-top:8px;font:9px/1.5 Consolas,monospace;color:var(--mute)}.repair-status.ok{color:var(--cyan)}.repair-status.err{color:var(--pink)}
</style>
</head>
<body>
<canvas id="stars"></canvas><div class="cursor-orb" id="cursorOrb"></div>
<div class="shell">
  <div class="top">
    <div class="brand"><i></i>APOCALYPSE <small>/ SPATIAL OS</small></div>
    <div class="tabs"><button id="spaceTab" class="active signal-text">SPACE</button><button id="opsTab" class="signal-text">OPS</button></div>
    <div class="spacer"></div>
    <button class="ghost scale-control signal-text" id="scaleBtn" title="UI scale">Aa</button>
    <button class="ghost signal-text" id="searchBtn">⌕</button><button class="ghost" id="homeBtn">⌂</button>
  </div>
  <div class="bottom"><div class="shortcut"><kbd>⌘ K</kbd> search</div><div class="trail" id="trail"><b>WORKSPACE</b> / semantic universe</div><div class="run-dock" id="runDock"><i></i><span id="runText">SYNCING RUN STATE…</span></div></div>
</div>
<section class="view" id="space"><canvas id="universe"></canvas></section>
<section class="view hidden" id="ops">
  <main class="instrument" id="instrument">
    <canvas id="weatherCanvas"></canvas><div class="ops-aurora ops-a" aria-hidden="true"></div><div class="ops-aurora ops-b" aria-hidden="true"></div><div class="ops-sweep" aria-hidden="true"></div>
    <section class="zone activity-zone focusable" data-focus="activity"><header><span class="signal-text">ACTIVITY FIELD</span><b id="activityKpi">—</b></header><div class="activity-wrap"><div class="activity-grid" id="activityGrid"></div><div class="day-log" id="dayLog"><div class="day-log-head"><span id="dayLogDate">DAY LOG</span><button id="closeDayLog">×</button></div><div class="day-summary" id="daySummary"></div><div class="day-stats" id="dayStats"></div><div class="day-work" id="dayWork"></div></div></div></section>
    <section class="zone quota-zone focusable" data-focus="quota"><header><span class="signal-text">LLM QUOTA</span><b>LIVE</b></header><div class="qrows" id="quotaRows"></div></section>
    <section class="zone agenda-zone focusable" data-focus="agenda"><header><span class="signal-text">AGENDA</span><b>TODAY</b></header><div class="agenda-list" id="agendaList"></div><div class="tasks" id="taskList"></div><div class="suggested" id="suggestedList"></div></section>
    <section class="zone sessions-zone focusable" data-focus="sessions"><header><span class="signal-text">SESSION CURRENT</span><b>SSE</b></header><div class="session-list" id="sessionList"></div></section>
    <section class="zone crew-zone focusable" data-focus="crew"><header><span class="signal-text">ACTIVE CREW</span><b id="agentCount">—</b></header><div class="crew-field" id="crewField"><canvas id="crewRain"></canvas><svg class="crew-signals" id="crewSignals" preserveAspectRatio="none"></svg><div class="crew-nodes" id="crewNodes"></div><div class="crew-legend"><span><i class="reasoning"></i>REASONING</span><span><i class="coding"></i>CODING</span><span><i class="waiting"></i>WAITING</span></div></div></section>
  </main>
</section>
<div class="tooltip" id="tooltip"><div class="k" id="ttKind"></div><div class="t" id="ttTitle"></div><div class="m" id="ttMeta"></div></div>
<aside class="inspector" id="inspector"><button class="close" id="closeInspector">×</button><div id="inspectorBody"></div></aside>
<div class="search" id="search"><div class="searchbox"><input id="searchInput" placeholder="Search project, session, decision, plan, agent, file…"><div class="results" id="results"></div></div></div>
<script src="/spatial_os.js"></script>
<script>
(()=>{
  const SCALE_KEY='apocalypse.uiScale.v2',STEPS=[1,1.15,1.3,1.45],scaleBtn=document.getElementById('scaleBtn'),universe=document.getElementById('universe');
  let currentScale=Number(localStorage.getItem(SCALE_KEY)||1.15);if(!STEPS.includes(currentScale))currentScale=1.15;

  const bases=new Map();
  const initial=[document.body,...document.body.querySelectorAll('*')].filter(el=>el instanceof HTMLElement&&!el.matches('canvas,svg,path,line,polyline,polygon'));
  const initialSizes=initial.map(el=>[el,parseFloat(getComputedStyle(el).fontSize)]);
  for(const [el,fs] of initialSizes)if(Number.isFinite(fs)&&fs>0)bases.set(el,fs);

  const menu=document.createElement('div');menu.className='ui-scale-menu';menu.innerHTML=STEPS.map(v=>`<button data-ui-scale="${v}">${Math.round(v*100)}%</button>`).join('');document.body.appendChild(menu);
  function applyScale(){
    for(const [el,base] of bases)if(el.isConnected&&!el.closest('.ui-scale-menu'))el.style.fontSize=(base*currentScale).toFixed(2)+'px';
    if(scaleBtn){scaleBtn.dataset.scale=Math.round(currentScale*100)+'%';scaleBtn.title=`UI scale · ${Math.round(currentScale*100)}%`}
  }
  function setScale(v){currentScale=v;localStorage.setItem(SCALE_KEY,String(v));menu.querySelectorAll('button').forEach(b=>b.classList.toggle('active',Number(b.dataset.uiScale)===v));applyScale()}
  menu.addEventListener('click',e=>{const b=e.target.closest('[data-ui-scale]');if(!b)return;setScale(Number(b.dataset.uiScale));menu.classList.remove('open')});scaleBtn?.addEventListener('click',e=>{e.stopPropagation();menu.classList.toggle('open')});document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==scaleBtn)menu.classList.remove('open')});setScale(currentScale);

  try{if(typeof ctx!=='undefined'&&ctx){const proto=Object.getPrototypeOf(ctx),desc=Object.getOwnPropertyDescriptor(proto,'font');if(desc?.get&&desc?.set)Object.defineProperty(ctx,'font',{configurable:true,get(){return desc.get.call(ctx)},set(v){desc.set.call(ctx,String(v).replace(/([0-9]*\.?[0-9]+)px/g,(_,n)=>`${(parseFloat(n)*currentScale).toFixed(2)}px`))}})}}catch(e){console.warn('Canvas font scaling unavailable',e)}

  let down=null;const hint=document.createElement('div');hint.className='space-back-hint';hint.textContent='CLICK OUTSIDE · ALL PROJECTS';document.body.appendChild(hint);
  universe?.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}},true);universe?.addEventListener('pointermove',e=>{try{if(typeof focus!=='undefined'&&focus&&typeof hit==='function'){const empty=!hit(e.clientX,e.clientY);hint.classList.toggle('show',empty&&!down);universe.style.cursor=empty?'zoom-out':''}else{hint.classList.remove('show');universe.style.cursor=''}}catch{}});universe?.addEventListener('pointerleave',()=>{hint.classList.remove('show');universe.style.cursor=''});universe?.addEventListener('pointerup',e=>{const start=down;down=null;if(!start||Math.hypot(e.clientX-start.x,e.clientY-start.y)>5)return;try{if(typeof focus==='undefined'||!focus||typeof hit!=='function'||typeof clearFocus!=='function'||hit(e.clientX,e.clientY))return;clearFocus();hint.classList.remove('show');universe.style.cursor=''}catch(err){console.warn('Outer-space back navigation unavailable',err)}});

  const inspectorBody=document.getElementById('inspectorBody');
  function injectClaudeMaintenance(){
    try{
      if(typeof selected==='undefined'||!selected||typeof WORLD==='undefined'||!WORLD)return;
      const o=WORLD.objects.find(x=>x.id===selected);if(!o||o.type!=='session'||o.provider==='codex'||!o.session_id)return;
      const actions=inspectorBody.querySelector('.inspect-actions');if(!actions)return;
      if(!actions.querySelector('[data-clean-context]')){
        const c=document.createElement('button');c.dataset.cleanContext=o.session_id;c.textContent='CLEAN NON-TEXT';c.title='Back up the Claude JSONL and remove image, thinking, tool-use/result, document, and other non-text content blocks';actions.appendChild(c);
      }
      if(!actions.querySelector('[data-repair-session]')){
        const b=document.createElement('button');b.dataset.repairSession=o.session_id;b.textContent='REPAIR JSONL';b.title='Back up the Claude JSONL transcript, remove malformed records, and atomically replace it';actions.appendChild(b);
      }
    }catch{}
  }
  new MutationObserver(injectClaudeMaintenance).observe(inspectorBody,{childList:true,subtree:true});
  function maintenanceStatus(button){let status=inspectorBody.querySelector('.repair-status');if(!status){status=document.createElement('div');status.className='repair-status';button.parentElement.insertAdjacentElement('afterend',status)}return status}
  inspectorBody.addEventListener('click',async e=>{
    const clean=e.target.closest('[data-clean-context]');
    if(clean){
      e.preventDefault();e.stopPropagation();const sid=clean.dataset.cleanContext;if(!sid)return;
      if(!confirm('Clean non-text blocks from this Claude conversation?\n\nApocalypse will back up the original JSONL first. Text blocks and message-tree records are preserved; image / thinking / tool_use / tool_result / document and other non-text blocks are removed. Active Claude sessions are refused.'))return;
      clean.disabled=true;const old=clean.textContent;clean.textContent='CLEANING…';const status=maintenanceStatus(clean);
      try{const r=await fetch(`/api/sessions2/${encodeURIComponent(sid)}/clean-context`,{method:'POST'});const j=await r.json();if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);status.className='repair-status ok';const types=Object.entries(j.removed_types||{}).map(([k,v])=>`${k}:${v}`).join(' · ');status.textContent=j.changed?`CLEANED · removed ${j.removed_blocks} non-text block(s) from ${j.messages_cleaned} message(s)${types?' · '+types:''} · backup: ${j.backup}`:'CHECKED · no non-text blocks found';clean.textContent=j.changed?'CLEANED':'TEXT ONLY'}catch(err){status.className='repair-status err';status.textContent='CLEAN FAILED · '+err.message;clean.textContent=old;clean.disabled=false}
      return;
    }
    const b=e.target.closest('[data-repair-session]');if(!b)return;e.preventDefault();e.stopPropagation();
    const sid=b.dataset.repairSession;if(!sid)return;
    if(!confirm('Repair this Claude JSONL?\n\nApocalypse will first back up the original transcript, then remove malformed JSON records. Active Claude sessions are refused.'))return;
    b.disabled=true;const old=b.textContent;b.textContent='REPAIRING…';const status=maintenanceStatus(b);
    try{const r=await fetch(`/api/sessions2/${encodeURIComponent(sid)}/repair`,{method:'POST'});const j=await r.json();if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);status.className='repair-status ok';status.textContent=j.changed?`REPAIRED · removed ${j.removed_records} malformed record(s) · backup: ${j.backup}`:'CHECKED · conversation file is already valid';b.textContent=j.changed?'REPAIRED':'VALID'}catch(err){status.className='repair-status err';status.textContent='REPAIR FAILED · '+err.message;b.textContent=old;b.disabled=false}
  });
})();
</script>
</body></html>
