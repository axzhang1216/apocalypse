<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apocalypse Spatial OS</title>
<link rel="stylesheet" href="/spatial_os.css">
<style>
:root{--apocalypse-ui-scale:1.15}.scale-control{position:relative;width:38px!important;font-weight:600;letter-spacing:-.04em}.ui-scale-menu{position:fixed;z-index:55;top:51px;right:52px;display:none;align-items:center;gap:3px;padding:5px;border:1px solid var(--hair);border-radius:10px;background:rgba(13,18,25,.96);box-shadow:0 16px 45px rgba(0,0,0,.35)}.ui-scale-menu.open{display:flex}.ui-scale-menu button{min-width:42px;height:30px;padding:0 7px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--mute);font:9px Consolas,monospace;cursor:pointer}.ui-scale-menu button:hover{background:rgba(255,255,255,.04);color:var(--ink)}.ui-scale-menu button.active{border-color:rgba(111,148,184,.3);background:rgba(111,148,184,.1);color:var(--ink);box-shadow:0 0 16px rgba(111,148,184,.07)}.scale-control[data-scale]:after{content:attr(data-scale);position:absolute;right:-5px;bottom:-4px;padding:1px 3px;border-radius:4px;background:#111821;color:var(--cyan);font:7px Consolas,monospace;letter-spacing:0}.space-back-hint{position:fixed;left:50%;bottom:56px;z-index:8;pointer-events:none;opacity:0;transform:translate(-50%,8px);transition:opacity .25s,transform .25s;padding:5px 9px;border:1px solid rgba(255,255,255,.05);border-radius:7px;background:rgba(11,16,22,.42);color:rgba(184,189,194,.7);font:9px Consolas,monospace;letter-spacing:.07em}.space-back-hint.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<canvas id="stars"></canvas><div class="cursor-orb" id="cursorOrb"></div>
<div class="shell">
  <div class="top">
    <div class="brand"><i></i>APOCALYPSE <small>/ SPATIAL OS</small></div>
    <div class="tabs"><button id="spaceTab" class="active signal-text">SPACE</button><button id="opsTab" class="signal-text">OPS</button></div>
    <div class="spacer"></div>
    <button class="ghost scale-control signal-text" id="scaleBtn" title="UI scale">Aa</button>
    <button class="ghost signal-text" id="searchBtn">⌕</button><button class="ghost" id="homeBtn">⌂</button>
  </div>
  <div class="bottom"><div class="shortcut"><kbd>⌘ K</kbd> search</div><div class="trail" id="trail"><b>WORKSPACE</b> / semantic universe</div><div class="run-dock" id="runDock"><i></i><span id="runText">SYNCING RUN STATE…</span></div></div>
</div>
<section class="view" id="space"><canvas id="universe"></canvas></section>
<section class="view hidden" id="ops">
  <main class="instrument" id="instrument">
    <canvas id="weatherCanvas"></canvas><div class="ops-aurora ops-a" aria-hidden="true"></div><div class="ops-aurora ops-b" aria-hidden="true"></div><div class="ops-sweep" aria-hidden="true"></div>
    <section class="zone activity-zone focusable" data-focus="activity"><header><span class="signal-text">ACTIVITY FIELD</span><b id="activityKpi">—</b></header><div class="activity-wrap"><div class="activity-grid" id="activityGrid"></div><div class="day-log" id="dayLog"><div class="day-log-head"><span id="dayLogDate">DAY LOG</span><button id="closeDayLog">×</button></div><div class="day-summary" id="daySummary"></div><div class="day-stats" id="dayStats"></div><div class="day-work" id="dayWork"></div></div></div></section>
    <section class="zone quota-zone focusable" data-focus="quota"><header><span class="signal-text">LLM QUOTA</span><b>LIVE</b></header><div class="qrows" id="quotaRows"></div></section>
    <section class="zone agenda-zone focusable" data-focus="agenda"><header><span class="signal-text">AGENDA</span><b>TODAY</b></header><div class="agenda-list" id="agendaList"></div><div class="tasks" id="taskList"></div><div class="suggested" id="suggestedList"></div></section>
    <section class="zone sessions-zone focusable" data-focus="sessions"><header><span class="signal-text">SESSION CURRENT</span><b>SSE</b></header><div class="session-list" id="sessionList"></div></section>
    <section class="zone crew-zone focusable" data-focus="crew"><header><span class="signal-text">ACTIVE CREW</span><b id="agentCount">—</b></header><div class="crew-field" id="crewField"><canvas id="crewRain"></canvas><svg class="crew-signals" id="crewSignals" preserveAspectRatio="none"></svg><div class="crew-nodes" id="crewNodes"></div><div class="crew-legend"><span><i class="reasoning"></i>REASONING</span><span><i class="coding"></i>CODING</span><span><i class="waiting"></i>WAITING</span></div></div></section>
  </main>
</section>
<div class="tooltip" id="tooltip"><div class="k" id="ttKind"></div><div class="t" id="ttTitle"></div><div class="m" id="ttMeta"></div></div>
<aside class="inspector" id="inspector"><button class="close" id="closeInspector">×</button><div id="inspectorBody"></div></aside>
<div class="search" id="search"><div class="searchbox"><input id="searchInput" placeholder="Search project, session, decision, plan, agent, file…"><div class="results" id="results"></div></div></div>
<script src="/spatial_os.js"></script>
<script>
(()=>{
  const SCALE_KEY='apocalypse.uiScale',STEPS=[1,1.15,1.3,1.45],root=document.documentElement,scaleBtn=document.getElementById('scaleBtn'),universe=document.getElementById('universe');let currentScale=Number(localStorage.getItem(SCALE_KEY)||1.15);if(!STEPS.includes(currentScale))currentScale=1.15;
  const baseline=new WeakMap();function scaleElement(el){if(!(el instanceof HTMLElement)||el.closest('.ui-scale-menu'))return;let base=baseline.get(el);if(!base){const fs=parseFloat(getComputedStyle(el).fontSize);if(!Number.isFinite(fs)||fs<=0)return;base=fs;baseline.set(el,base)}el.style.fontSize=(base*currentScale).toFixed(2)+'px'}
  function scaleDom(){document.querySelectorAll('body *').forEach(scaleElement);if(scaleBtn){scaleBtn.dataset.scale=Math.round(currentScale*100)+'%';scaleBtn.title=`UI scale · ${Math.round(currentScale*100)}%`}}
  new MutationObserver(rs=>{for(const r of rs)for(const n of r.addedNodes){if(!(n instanceof HTMLElement))continue;scaleElement(n);n.querySelectorAll?.('*').forEach(scaleElement)}}).observe(document.body,{childList:true,subtree:true});
  try{if(typeof ctx!=='undefined'&&ctx){const proto=Object.getPrototypeOf(ctx),desc=Object.getOwnPropertyDescriptor(proto,'font');if(desc?.get&&desc?.set)Object.defineProperty(ctx,'font',{configurable:true,get(){return desc.get.call(ctx)},set(v){desc.set.call(ctx,String(v).replace(/([0-9]*\.?[0-9]+)px/g,(_,n)=>`${(parseFloat(n)*currentScale).toFixed(2)}px`))}})}}catch(e){console.warn('Canvas font scaling unavailable',e)}
  const menu=document.createElement('div');menu.className='ui-scale-menu';menu.innerHTML=STEPS.map(v=>`<button data-ui-scale="${v}">${Math.round(v*100)}%</button>`).join('');document.body.appendChild(menu);
  function setScale(v){currentScale=v;root.style.setProperty('--apocalypse-ui-scale',v);localStorage.setItem(SCALE_KEY,String(v));menu.querySelectorAll('button').forEach(b=>b.classList.toggle('active',Number(b.dataset.uiScale)===v));scaleDom()}
  menu.addEventListener('click',e=>{const b=e.target.closest('[data-ui-scale]');if(!b)return;setScale(Number(b.dataset.uiScale));menu.classList.remove('open')});scaleBtn?.addEventListener('click',e=>{e.stopPropagation();menu.classList.toggle('open')});document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==scaleBtn)menu.classList.remove('open')});setScale(currentScale);
  let down=null;const hint=document.createElement('div');hint.className='space-back-hint';hint.textContent='CLICK OUTSIDE · ALL PROJECTS';document.body.appendChild(hint);
  universe?.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}},true);universe?.addEventListener('pointermove',e=>{try{if(typeof focus!=='undefined'&&focus&&typeof hit==='function'){const empty=!hit(e.clientX,e.clientY);hint.classList.toggle('show',empty&&!down);universe.style.cursor=empty?'zoom-out':''}else{hint.classList.remove('show');universe.style.cursor=''}}catch{}});universe?.addEventListener('pointerleave',()=>{hint.classList.remove('show');universe.style.cursor=''});universe?.addEventListener('pointerup',e=>{const start=down;down=null;if(!start||Math.hypot(e.clientX-start.x,e.clientY-start.y)>5)return;try{if(typeof focus==='undefined'||!focus||typeof hit!=='function'||typeof clearFocus!=='function'||hit(e.clientX,e.clientY))return;clearFocus();hint.classList.remove('show');universe.style.cursor=''}catch(err){console.warn('Outer-space back navigation unavailable',err)}})
})();
</script>
</body></html>
