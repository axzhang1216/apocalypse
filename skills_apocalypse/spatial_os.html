<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apocalypse Spatial OS</title>
<link rel="stylesheet" href="/spatial_os.css">
<style>
.settings-control{position:relative;width:38px!important;font-size:15px!important;line-height:1}.settings-menu{position:fixed;z-index:60;top:51px;right:52px;width:246px;display:none;padding:8px;border:1px solid var(--hair);border-radius:12px;background:rgba(13,18,25,.97);box-shadow:0 18px 55px rgba(0,0,0,.4);backdrop-filter:blur(14px)}.settings-menu.open{display:block}.settings-head{display:flex;align-items:center;justify-content:space-between;padding:4px 5px 8px;color:var(--ink);font:600 10px Consolas,monospace;letter-spacing:.09em}.settings-head small{color:var(--mute);font:8px Consolas,monospace;letter-spacing:.04em}.settings-section{padding:8px 5px;border-top:1px solid rgba(255,255,255,.055)}.settings-label{display:flex;justify-content:space-between;margin-bottom:7px;color:var(--mute);font:8px Consolas,monospace;letter-spacing:.08em}.settings-label b{color:var(--cyan);font-weight:500}.scale-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.scale-steps button,.settings-action{height:31px;border:1px solid transparent;border-radius:7px;background:rgba(255,255,255,.025);color:var(--mute);font:9px Consolas,monospace;cursor:pointer}.scale-steps button:hover,.settings-action:hover{background:rgba(255,255,255,.05);color:var(--ink)}.scale-steps button.active{border-color:rgba(111,148,184,.32);background:rgba(111,148,184,.1);color:var(--ink)}.settings-action{width:100%;margin-top:5px;text-align:left;padding:0 10px;display:flex;align-items:center;justify-content:space-between}.settings-action span{color:var(--ink)}.settings-action small{font:8px Consolas,monospace;color:var(--mute)}.settings-action.busy{opacity:.55;pointer-events:none}.settings-status{min-height:14px;padding:7px 5px 2px;color:var(--mute);font:8px/1.45 Consolas,monospace}.settings-status.ok{color:var(--cyan)}.settings-status.err{color:var(--pink)}.space-back-hint{position:fixed;left:50%;bottom:56px;z-index:8;pointer-events:none;opacity:0;transform:translate(-50%,8px);transition:opacity .25s,transform .25s;padding:5px 9px;border:1px solid rgba(255,255,255,.05);border-radius:7px;background:rgba(11,16,22,.42);color:rgba(184,189,194,.7);font:9px Consolas,monospace;letter-spacing:.07em}.space-back-hint.show{opacity:1;transform:translate(-50%,0)}.repair-status{margin-top:8px;font:9px/1.5 Consolas,monospace;color:var(--mute)}.repair-status.ok{color:var(--cyan)}.repair-status.err{color:var(--pink)}
</style>
</head>
<body>
<canvas id="stars"></canvas><div class="cursor-orb" id="cursorOrb"></div>
<div class="shell">
  <div class="top">
    <div class="brand"><i></i>APOCALYPSE <small>/ SPATIAL OS</small></div>
    <div class="tabs"><button id="spaceTab" class="active signal-text">SPACE</button><button id="opsTab" class="signal-text">OPS</button></div>
    <div class="spacer"></div>
    <button class="ghost settings-control signal-text" id="settingsBtn" title="Settings">⚙</button>
    <button class="ghost signal-text" id="searchBtn">⌕</button><button class="ghost" id="homeBtn">⌂</button>
  </div>
  <div class="bottom"><div class="shortcut"><kbd>⌘ K</kbd> search</div><div class="trail" id="trail"><b>WORKSPACE</b> / semantic universe</div><div class="run-dock" id="runDock"><i></i><span id="runText">SYNCING RUN STATE…</span></div></div>
</div>
<section class="view" id="space"><canvas id="universe"></canvas></section>
<section class="view hidden" id="ops">
  <main class="instrument" id="instrument">
    <canvas id="weatherCanvas"></canvas><div class="ops-aurora ops-a" aria-hidden="true"></div><div class="ops-aurora ops-b" aria-hidden="true"></div><div class="ops-sweep" aria-hidden="true"></div>
    <section class="zone activity-zone focusable" data-focus="activity"><header><span class="signal-text">ACTIVITY FIELD</span><b id="activityKpi">—</b></header><div class="activity-wrap"><div class="activity-grid" id="activityGrid"></div><div class="day-log" id="dayLog"><div class="day-log-head"><span id="dayLogDate">DAY LOG</span><button id="closeDayLog">×</button></div><div class="day-summary" id="daySummary"></div><div class="day-stats" id="dayStats"></div><div class="day-work" id="dayWork"></div></div></div></section>
    <section class="zone quota-zone focusable" data-focus="quota"><header><span class="signal-text">LLM QUOTA</span><b>LIVE</b></header><div class="qrows" id="quotaRows"></div></section>
    <section class="zone agenda-zone focusable" data-focus="agenda"><header><span class="signal-text">AGENDA</span><b>TODAY</b></header><div class="agenda-list" id="agendaList"></div><div class="tasks" id="taskList"></div><div class="suggested" id="suggestedList"></div></section>
    <section class="zone sessions-zone focusable" data-focus="sessions"><header><span class="signal-text">SESSION CURRENT</span><b>SSE</b></header><div class="session-list" id="sessionList"></div></section>
    <section class="zone crew-zone focusable" data-focus="crew"><header><span class="signal-text">ACTIVE CREW</span><b id="agentCount">—</b></header><div class="crew-field" id="crewField"><canvas id="crewRain"></canvas><svg class="crew-signals" id="crewSignals" preserveAspectRatio="none"></svg><div class="crew-nodes" id="crewNodes"></div></div></section>
  </main>
</section>
<div class="tooltip" id="tooltip"><div class="k" id="ttKind"></div><div class="t" id="ttTitle"></div><div class="m" id="ttMeta"></div></div>
<aside class="inspector" id="inspector"><button class="close" id="closeInspector">×</button><div id="inspectorBody"></div></aside>
<div class="search" id="search"><div class="searchbox"><input id="searchInput" placeholder="Search project, session, decision, plan, agent, file…"><div class="results" id="results"></div></div></div>
<script src="/spatial_os.js"></script>
<script>
(()=>{
  const SCALE_KEY='apocalypse.uiScale.v2',STEPS=[1,1.15,1.3,1.45],settingsBtn=document.getElementById('settingsBtn'),universe=document.getElementById('universe');
  let currentScale=Number(localStorage.getItem(SCALE_KEY)||1.15);if(!STEPS.includes(currentScale))currentScale=1.15;
  const bases=new Map(),initial=[document.body,...document.body.querySelectorAll('*')].filter(el=>el instanceof HTMLElement&&!el.matches('canvas,svg,path,line,polyline,polygon'));
  for(const [el,fs] of initial.map(el=>[el,parseFloat(getComputedStyle(el).fontSize)]))if(Number.isFinite(fs)&&fs>0)bases.set(el,fs);

  const menu=document.createElement('div');menu.className='settings-menu';menu.innerHTML=`
    <div class="settings-head"><span>SETTINGS</span><small id="settingsVersion">APOCALYPSE</small></div>
    <div class="settings-section"><div class="settings-label"><span>UI SCALE</span><b id="settingsScaleValue"></b></div><div class="scale-steps">${STEPS.map(v=>`<button data-ui-scale="${v}">${Math.round(v*100)}%</button>`).join('')}</div></div>
    <div class="settings-section"><button class="settings-action" id="reinitBtn"><span>REINITIALIZE</span><small>AGENTS / PROVIDERS / MODEL</small></button><button class="settings-action" id="updateBtn"><span>UPDATE</span><small id="updateMeta">CHECK RELEASE</small></button></div>
    <div class="settings-status" id="settingsStatus"></div>`;document.body.appendChild(menu);
  const scaleValue=menu.querySelector('#settingsScaleValue'),statusEl=menu.querySelector('#settingsStatus'),versionEl=menu.querySelector('#settingsVersion'),updateMeta=menu.querySelector('#updateMeta'),reinitBtn=menu.querySelector('#reinitBtn'),updateBtn=menu.querySelector('#updateBtn');
  function setStatus(text,kind=''){statusEl.className='settings-status'+(kind?' '+kind:'');statusEl.textContent=text||''}
  function applyScale(){for(const [el,base] of bases)if(el.isConnected&&!el.closest('.settings-menu'))el.style.fontSize=(base*currentScale).toFixed(2)+'px';scaleValue.textContent=Math.round(currentScale*100)+'%'}
  function setScale(v){currentScale=v;localStorage.setItem(SCALE_KEY,String(v));menu.querySelectorAll('[data-ui-scale]').forEach(b=>b.classList.toggle('active',Number(b.dataset.uiScale)===v));applyScale()}
  menu.addEventListener('click',e=>{const b=e.target.closest('[data-ui-scale]');if(b){setScale(Number(b.dataset.uiScale));e.stopPropagation()}});
  settingsBtn?.addEventListener('click',async e=>{e.stopPropagation();menu.classList.toggle('open');if(!menu.classList.contains('open'))return;setStatus('');try{const s=await fetch('/api/settings/status',{cache:'no-store'}).then(r=>r.json());versionEl.textContent=`V${s.version||'—'} · ${(s.arch||'').toUpperCase()}`;updateMeta.textContent='CHECK RELEASE'}catch{versionEl.textContent='VERSION UNKNOWN'}});
  document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==settingsBtn)menu.classList.remove('open')});
  reinitBtn.onclick=async e=>{e.stopPropagation();if(!confirm('Reinitialize Apocalypse?\n\nThis will rescan installed agents/providers and reopen the setup wizard so you can choose Plan usage and the Apocalypse analysis model again.'))return;reinitBtn.classList.add('busy');setStatus('LAUNCHING SETUP…');try{const r=await fetch('/api/settings/reinitialize',{method:'POST'}),j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||`HTTP ${r.status}`);setStatus('SETUP WINDOW LAUNCHED · finish configuration there','ok')}catch(err){setStatus('REINITIALIZE FAILED · '+err.message,'err')}finally{reinitBtn.classList.remove('busy')}};
  updateBtn.onclick=async e=>{e.stopPropagation();updateBtn.classList.add('busy');setStatus('CHECKING LATEST RELEASE…');try{const r=await fetch('/api/settings/update',{cache:'no-store'}),j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||`HTTP ${r.status}`);updateMeta.textContent=j.latest_version?`LATEST V${j.latest_version}`:'NO RELEASE';if(!j.available){setStatus(`UP TO DATE · V${j.current_version}`,'ok');return}if(!j.can_install)throw new Error(`V${j.latest_version} found but no ${j.arch} installer asset is available`);if(!confirm(`Apocalypse v${j.latest_version} is available.\n\nDownload and launch ${j.asset_name}?`)){setStatus(`UPDATE AVAILABLE · V${j.latest_version}`);return}setStatus(`DOWNLOADING V${j.latest_version}…`);const rr=await fetch('/api/settings/update',{method:'POST'}),jj=await rr.json();if(!rr.ok||jj.ok===false)throw new Error(jj.error||`HTTP ${rr.status}`);setStatus(jj.launched?'INSTALLER LAUNCHED · complete setup, then reopen Apocalypse':'ALREADY UP TO DATE','ok')}catch(err){setStatus('UPDATE FAILED · '+err.message,'err')}finally{updateBtn.classList.remove('busy')}};
  setScale(currentScale);

  try{if(typeof ctx!=='undefined'&&ctx){const proto=Object.getPrototypeOf(ctx),desc=Object.getOwnPropertyDescriptor(proto,'font');if(desc?.get&&desc?.set)Object.defineProperty(ctx,'font',{configurable:true,get(){return desc.get.call(ctx)},set(v){desc.set.call(ctx,String(v).replace(/([0-9]*\.?[0-9]+)px/g,(_,n)=>`${(parseFloat(n)*currentScale).toFixed(2)}px`))}})}}catch(e){console.warn('Canvas font scaling unavailable',e)}

  let down=null;const hint=document.createElement('div');hint.className='space-back-hint';hint.textContent='CLICK OUTSIDE · ALL PROJECTS';document.body.appendChild(hint);
  universe?.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}},true);universe?.addEventListener('pointermove',e=>{try{if(typeof focus!=='undefined'&&focus&&typeof hit==='function'){const empty=!hit(e.clientX,e.clientY);hint.classList.toggle('show',empty&&!down);universe.style.cursor=empty?'zoom-out':''}else{hint.classList.remove('show');universe.style.cursor=''}}catch{}});universe?.addEventListener('pointerleave',()=>{hint.classList.remove('show');universe.style.cursor=''});universe?.addEventListener('pointerup',e=>{const start=down;down=null;if(!start||Math.hypot(e.clientX-start.x,e.clientY-start.y)>5)return;try{if(typeof focus==='undefined'||!focus||typeof hit!=='function'||typeof clearFocus!=='function'||hit(e.clientX,e.clientY))return;clearFocus();hint.classList.remove('show');universe.style.cursor=''}catch(err){console.warn('Outer-space back navigation unavailable',err)}});

  const inspectorBody=document.getElementById('inspectorBody');
  function injectClaudeMaintenance(){try{if(typeof selected==='undefined'||!selected||typeof WORLD==='undefined'||!WORLD)return;const o=WORLD.objects.find(x=>x.id===selected);if(!o||o.type!=='session'||o.provider==='codex'||!o.session_id)return;const actions=inspectorBody.querySelector('.inspect-actions');if(!actions)return;if(!actions.querySelector('[data-clean-context]')){const c=document.createElement('button');c.dataset.cleanContext=o.session_id;c.textContent='CLEAN NON-TEXT';c.title='Back up Claude JSONL and remove non-text content blocks';actions.appendChild(c)}if(!actions.querySelector('[data-repair-session]')){const b=document.createElement('button');b.dataset.repairSession=o.session_id;b.textContent='REPAIR JSONL';b.title='Back up Claude JSONL and remove malformed records';actions.appendChild(b)}}catch{}}
  new MutationObserver(injectClaudeMaintenance).observe(inspectorBody,{childList:true,subtree:true});
  function maintenanceStatus(button){let s=inspectorBody.querySelector('.repair-status');if(!s){s=document.createElement('div');s.className='repair-status';button.parentElement.insertAdjacentElement('afterend',s)}return s}
  inspectorBody.addEventListener('click',async e=>{const clean=e.target.closest('[data-clean-context]');if(clean){e.preventDefault();e.stopPropagation();const sid=clean.dataset.cleanContext;if(!sid)return;if(!confirm('Clean non-text blocks from this Claude conversation?\n\nThe original JSONL is backed up first. Active sessions are refused.'))return;clean.disabled=true;const old=clean.textContent;clean.textContent='CLEANING…';const s=maintenanceStatus(clean);try{const r=await fetch(`/api/sessions2/${encodeURIComponent(sid)}/clean-context`,{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);s.className='repair-status ok';const types=Object.entries(j.removed_types||{}).map(([k,v])=>`${k}:${v}`).join(' · ');s.textContent=j.changed?`CLEANED · removed ${j.removed_blocks} non-text block(s) from ${j.messages_cleaned} message(s)${types?' · '+types:''} · backup: ${j.backup}`:'CHECKED · no non-text blocks found';clean.textContent=j.changed?'CLEANED':'TEXT ONLY'}catch(err){s.className='repair-status err';s.textContent='CLEAN FAILED · '+err.message;clean.textContent=old;clean.disabled=false}return}const b=e.target.closest('[data-repair-session]');if(!b)return;e.preventDefault();e.stopPropagation();const sid=b.dataset.repairSession;if(!sid)return;if(!confirm('Repair this Claude JSONL?\n\nThe original transcript is backed up first. Active sessions are refused.'))return;b.disabled=true;const old=b.textContent;b.textContent='REPAIRING…';const s=maintenanceStatus(b);try{const r=await fetch(`/api/sessions2/${encodeURIComponent(sid)}/repair`,{method:'POST'}),j=await r.json();if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);s.className='repair-status ok';s.textContent=j.changed?`REPAIRED · removed ${j.removed_records} malformed record(s) · backup: ${j.backup}`:'CHECKED · conversation file is already valid';b.textContent=j.changed?'REPAIRED':'VALID'}catch(err){s.className='repair-status err';s.textContent='REPAIR FAILED · '+err.message;b.textContent=old;b.disabled=false}});
})();
</script>
</body></html>
