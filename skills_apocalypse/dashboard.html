<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🌋 Apocalypse</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
    --border: #30363d; --text: #c9d1d9; --muted: #8b949e;
    --green: #3fb950; --yellow: #d29922; --grey: #6e7681;
    --red: #f85149; --blue: #58a6ff; --accent: #f85149;
    --user-bg: #1f2937; --assistant-bg: #1a2733; --tool-bg: #1c2128;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'SF Mono', 'Fira Code', Consolas, monospace; font-size: 14px; height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg2); }
  header h1 { font-size: 16px; font-weight: 600; }
  #banner { display: none; background: var(--yellow); color: #000; text-align: center; padding: 4px; font-size: 13px; }
  .layout { display: flex; flex: 1; overflow: hidden; }
  #session-pane { width: 320px; border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg2); }
  #session-pane h2 { font-size: 12px; color: var(--muted); padding: 10px 12px 6px; text-transform: uppercase; letter-spacing: 0.08em; display: flex; justify-content: space-between; align-items: center; }
  #session-pane h2 button { font-size: 12px; padding: 2px 6px; }
  .session-row { padding: 8px 12px; cursor: pointer; border-left: 3px solid transparent; display: flex; align-items: flex-start; gap: 8px; border-bottom: 1px solid var(--border); }
  .session-row:hover { background: var(--bg3); }
  .session-row.active { border-left-color: var(--accent); background: var(--bg3); }
  .session-row .body { flex: 1; min-width: 0; }
  .session-row .title { font-weight: 600; word-break: break-word; }
  .session-row .meta { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .session-row .actions { display: flex; gap: 4px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.yellow { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); }
  .dot.grey { background: var(--grey); }
  .id-chip { font-family: monospace; background: var(--bg); padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border); font-size: 12px; }
  .icon-btn { background: transparent; border: 1px solid transparent; color: var(--muted); padding: 2px 5px; border-radius: 3px; cursor: pointer; font-size: 13px; }
  .icon-btn:hover { color: var(--text); background: var(--bg3); border-color: var(--border); }
  .icon-btn.danger:hover { color: var(--red); }
  #detail-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #detail-header { padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg2); display: flex; justify-content: space-between; align-items: center; }
  #detail-title-row { display: flex; align-items: center; gap: 12px; }
  #detail-title { font-weight: 600; }
  #export-btn { font-size: 12px; padding: 3px 10px; border: 1px solid var(--border); }
  #detail-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #conversation { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { margin-bottom: 14px; max-width: 90%; }
  .msg .role-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 4px; }
  .msg .bubble { padding: 8px 12px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { margin-right: auto; }
  .msg.user .bubble { background: var(--user-bg); border: 1px solid var(--border); }
  .msg.assistant { margin-left: auto; }
  .msg.assistant .bubble { background: var(--assistant-bg); border: 1px solid #2c4458; }
  .msg.thinking .bubble { background: #1a1a2e; border: 1px dashed #4a4a6e; color: var(--muted); font-style: italic; }
  .msg.tool { margin-right: auto; max-width: 95%; }
  .tool-card { background: var(--tool-bg); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .tool-head { padding: 4px 10px; background: var(--bg3); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tool-head .tool-name { color: var(--blue); font-weight: 600; font-size: 12px; white-space: nowrap; }
  .tool-head .tool-preview { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .tool-head .tool-arrow { color: var(--muted); transition: transform 0.15s; font-size: 11px; flex-shrink: 0; }
  .tool-card.expanded .tool-head .tool-arrow { transform: rotate(90deg); }
  .tool-body { display: none; padding: 8px 10px; border-top: 1px solid var(--border); }
  .tool-card.expanded .tool-body { display: block; }
  .tool-section { margin-bottom: 8px; }
  .tool-section:last-child { margin-bottom: 0; }
  .tool-section-label { font-size: 11px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.05em; }
  .tool-content { white-space: pre-wrap; word-break: break-word; font-size: 13px; background: var(--bg); padding: 6px 8px; border-radius: 4px; max-height: 300px; overflow-y: auto; }
  .tool-content.error { color: var(--red); }
  .msg .role-label.user-label { color: var(--green); }
  .msg .role-label.assistant-label { color: var(--blue); }
  .msg .ts { font-size: 11px; color: var(--muted); margin-top: 3px; }
  #empty { color: var(--muted); padding: 40px; text-align: center; }
  .copy-toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg3); border: 1px solid var(--green); color: var(--green); padding: 8px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 1000; }
  .copy-toast.show { opacity: 1; }

  /* ── Tab bar ── */
  .tab-bar { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  .tab { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; }
  .tab:hover { color: var(--text); background: var(--bg3); }
  .tab.active { color: var(--text); background: var(--bg3); border-color: var(--blue); }
  .codex-badge { font-size: 9px; letter-spacing: 0.05em; color: var(--blue); border: 1px solid var(--border); border-radius: 3px; padding: 2px 4px; flex-shrink: 0; margin-top: 2px; text-transform: uppercase; }

  /* ── Activity heatmap ── */
  #heatmap-section { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  #heatmap-section h3 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  #heatmap-section h3 span { font-size: 11px; color: var(--muted); text-transform: none; letter-spacing: normal; }
  #heatmap-grid { display: flex; gap: 2px; }
  #heatmap-grid .hm-col { display: flex; flex-direction: column; gap: 2px; }
  .hm-cell { width: 11px; height: 11px; border-radius: 2px; cursor: pointer; position: relative; }
  .hm-cell:hover { outline: 1px solid var(--text); outline-offset: -1px; }
  .hm-l0 { background: var(--bg); }
  .hm-l1 { background: #0e4429; }
  .hm-l2 { background: #006d32; }
  .hm-l3 { background: #26a641; }
  .hm-l4 { background: #39d353; }
  .hm-month { font-size: 10px; color: var(--muted); margin-bottom: 2px; }
  #hm-tooltip {
    display: none; position: fixed; z-index: 100;
    background: var(--bg3); border: 1px solid var(--border);
    padding: 4px 8px; border-radius: 4px; font-size: 11px;
    color: var(--text); pointer-events: none; white-space: nowrap;
  }
  .hm-legend { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); margin-top: 4px; justify-content: flex-end; }
  .hm-legend .hm-cell { cursor: default; }
  .hm-legend .hm-cell:hover { outline: none; }

  /* ── Search ── */
  #search-box { padding: 8px 12px; border-bottom: 1px solid var(--border); }
  #search-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 6px 10px; border-radius: 4px;
    font-family: inherit; font-size: 13px; outline: none;
  }
  #search-input:focus { border-color: var(--blue); }
  #search-input::placeholder { color: var(--grey); }
  #search-results { display: none; border-bottom: 1px solid var(--border); max-height: 40vh; overflow-y: auto; }
  #search-results.visible { display: block; }
  .sr-header { padding: 8px 12px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; display: flex; justify-content: space-between; align-items: center; }
  .sr-header button { font-size: 11px; padding: 2px 6px; background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 3px; cursor: pointer; }
  .sr-header button:hover { color: var(--text); background: var(--bg3); }
  .sr-item { padding: 8px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .sr-item:hover { background: var(--bg3); }
  .sr-item .sr-proj { font-size: 11px; color: var(--blue); margin-bottom: 2px; }
  .sr-item .sr-snippet { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .sr-item .sr-snippet mark { color: var(--yellow); background: transparent; font-weight: 600; }
  .sr-item .sr-actions { margin-top: 4px; }
  .sr-item .sr-open {
    font-size: 11px; padding: 2px 8px; border: 1px solid var(--green);
    color: var(--green); background: transparent; border-radius: 3px;
    cursor: pointer; font-family: inherit;
  }
  .sr-item .sr-open:hover { background: var(--green); color: var(--bg); }
  .sr-item .sr-open:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Pager ── */
  #session-pager { position: sticky; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--bg2); }
  .pg-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 3px 10px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; }
  .pg-btn:hover:not(:disabled) { color: var(--text); background: var(--bg3); border-color: var(--blue); }
  .pg-btn:disabled { opacity: 0.35; cursor: default; }
  .pg-info { color: var(--muted); font-size: 12px; white-space: nowrap; }

  /* ── Repair modal ── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 200; }
  .modal-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 16px 20px; max-width: 520px; min-width: 320px; }
  .modal-card h3 { margin: 0 0 10px 0; font-size: 15px; }
  #repair-modal-body { font-size: 13px; line-height: 1.6; color: var(--text); }
  #repair-modal-body code { background: var(--bg); padding: 1px 4px; border-radius: 3px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  .modal-actions .pg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
<div id="banner">⚡ disconnected · reconnecting...</div>
<header>
  <h1>🌋 Apocalypse</h1>
  <div style="color: var(--muted); font-size: 12px;">live transcript view</div>
  <a href="/workspace.html" style="margin-left: auto; color: var(--muted); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 4px;" onmouseover="this.style.color='var(--text)';this.style.background='var(--bg3)'" onmouseout="this.style.color='var(--muted)';this.style.background='transparent'">🌌 Workspace</a>
</header>

<div class="layout">
  <div id="session-pane">
    <div class="tab-bar">
      <button class="tab active" data-tab="claude" onclick="switchTab('claude')">Claude</button>
      <button class="tab" data-tab="codex" onclick="switchTab('codex')">Codex</button>
    </div>
    <div id="heatmap-section">
      <h3>Vib Coding 活跃度 <span id="heatmap-total"></span></h3>
      <div id="heatmap-grid"></div>
      <div class="hm-legend">
        <span>少</span>
        <div class="hm-cell hm-l0"></div>
        <div class="hm-cell hm-l1"></div>
        <div class="hm-cell hm-l2"></div>
        <div class="hm-cell hm-l3"></div>
        <div class="hm-cell hm-l4"></div>
        <span>多</span>
      </div>
      <div id="hm-tooltip"></div>
    </div>
    <div id="search-box">
      <input id="search-input" type="text" placeholder="搜索 session 内容..." />
    </div>
    <div id="search-results">
      <div class="sr-header">
        <span id="sr-count"></span>
        <button onclick="clearSearch()">清除</button>
      </div>
      <div id="sr-list"></div>
    </div>
    <h2>
      <span>Sessions <span id="session-count" style="color: var(--muted)"></span></span>
      <button class="icon-btn" onclick="refreshSessions()" title="Refresh">⟳</button>
    </h2>
    <div id="session-list"></div>
    <div id="session-pager"></div>
  </div>
  <div id="detail-pane">
    <div id="detail-header">
      <div>
        <div id="detail-title-row">
          <div id="detail-title">Select a session</div>
          <button id="export-btn" class="icon-btn" style="display: none;" onclick="exportConversation()" title="Export conversation as .txt">Export</button>
        </div>
        <div id="detail-meta"></div>
      </div>
    </div>
    <div id="conversation"><div id="empty">No session selected.</div></div>
  </div>
</div>

<div class="copy-toast" id="toast"></div>

<div id="repair-modal" class="modal-overlay" style="display:none">
  <div class="modal-card">
    <h3>🧹 清理非文本块（严格文本模式）</h3>
    <div id="repair-modal-body">加载中…</div>
    <div class="modal-actions">
      <button class="pg-btn" id="repair-cancel">取消</button>
      <button class="pg-btn" id="repair-confirm" disabled>确认清理</button>
    </div>
  </div>
</div>

<script>
let sessions = [];
let selectedId = null;
let currentMsgs = [];
let evtSource = null;
let reconnectTimer = null;
let currentTab = "claude";
const PAGE_SIZE = 50;
let currentPage = 1;

function agentLabel() {
  return currentTab === "codex" ? "Codex" : "Claude";
}

function switchTab(tab) {
  if (tab === currentTab) return;
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  const isCodex = tab === "codex";
  document.getElementById('heatmap-section').style.display = isCodex ? 'none' : '';
  document.getElementById('search-box').style.display = isCodex ? 'none' : '';
  if (typeof clearSearch === 'function') clearSearch();
  selectedId = null;
  currentPage = 1;
  clearDetail();
  refreshSessions();
}

function escapeHTML(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function timeAgo(ts) {
  if (!ts) return '';
  const diff = Math.floor((Date.now() - new Date(ts)) / 1000);
  if (isNaN(diff)) return '';
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 1600);
}

async function copyText(text, label) {
  try {
    await navigator.clipboard.writeText(text);
    toast((label || 'Copied') + ': ' + text);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast((label || 'Copied') + ': ' + text); }
    catch (_) { toast('Copy failed'); }
    document.body.removeChild(ta);
  }
}

function renderSessionList() {
  const el = document.getElementById('session-list');
  document.getElementById('session-count').textContent = sessions.length ? '(' + sessions.length + ')' : '';
  const isCodex = currentTab === "codex";
  if (!sessions.length) {
    el.innerHTML = isCodex
      ? '<div style="color: var(--muted); padding: 16px;">No Codex sessions found in ~/.codex/sessions/</div>'
      : '<div style="color: var(--muted); padding: 16px;">No sessions found in ~/.claude/projects/</div>';
    renderPager(1, 1);
    return;
  }
  const totalPages = Math.max(1, Math.ceil(sessions.length / PAGE_SIZE));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;
  const start = (currentPage - 1) * PAGE_SIZE;
  const pageItems = sessions.slice(start, start + PAGE_SIZE);
  el.innerHTML = pageItems.map(s => {
    const short = (s.session_id || '').slice(0, 8);
    const title = isCodex ? (s.thread_name || s.project_name || 'unknown') : (s.project_name || 'unknown');
    const leftCol = isCodex
      ? `<div class="codex-badge">Codex</div>`
      : `<div class="dot ${escapeHTML(s.status)}"></div>`;
    const metaActions = isCodex
      ? `<span>${escapeHTML(timeAgo(s.last_ts))}</span>`
      : `<span class="id-chip" title="${escapeHTML(s.session_id)}">${escapeHTML(short)}</span>
         <button class="icon-btn" data-act="copy" data-id="${escapeHTML(s.session_id)}" title="Copy resume id (claude --resume ${escapeHTML(s.session_id)})">⧉</button>
         <span>${escapeHTML(timeAgo(s.last_ts))}</span>`;
    const actionsCol = isCodex
      ? ''
      : `<div class="actions">
           <button class="icon-btn" data-act="repair" data-id="${escapeHTML(s.session_id)}" title="清理 non-text 块（仅在 Claude 模型拒收当前会话时使用）">🧹</button>
           <button class="icon-btn danger" data-act="delete" data-id="${escapeHTML(s.session_id)}" title="Delete dashboard record (does NOT touch the original transcript)">🗑</button>
         </div>`;
    return `
      <div class="session-row ${selectedId === s.session_id ? 'active' : ''}" data-id="${escapeHTML(s.session_id)}">
        ${leftCol}
        <div class="body">
          <div class="title">${escapeHTML(title)}</div>
          <div class="meta">${metaActions}</div>
          <div class="meta" style="margin-top: 2px; opacity: 0.7;">${escapeHTML(s.cwd || '')}</div>
        </div>
        ${actionsCol}
      </div>`;
  }).join('');

  el.querySelectorAll('.session-row').forEach(node => {
    node.addEventListener('click', e => {
      if (e.target.closest('button')) return;
      selectSession(node.dataset.id);
    });
  });
  el.querySelectorAll('[data-act="copy"]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      copyText(b.dataset.id, 'Resume id');
    });
  });
  el.querySelectorAll('[data-act="repair"]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      openRepairModal(b.dataset.id);
    });
  });
  el.querySelectorAll('[data-act="delete"]').forEach(b => {
    b.addEventListener('click', async e => {
      e.stopPropagation();
      const id = b.dataset.id;
      if (!confirm('是否彻底删除此 session 的面板记录？\n删除后不可恢复，原始对话不受影响。\n\nsession: ' + id)) return;
      try {
        const r = await fetch('/api/sessions2/' + encodeURIComponent(id), { method: 'DELETE' });
        const j = await r.json();
        if (!r.ok || !j.ok) { toast('Delete failed'); return; }
        toast('Deleted ' + (j.events_dropped || 0) + ' events');
        if (selectedId === id) { selectedId = null; clearDetail(); }
        await refreshSessions();
      } catch (_) {
        toast('Delete failed');
      }
    });
  });
  renderPager(currentPage, totalPages);
}

function renderPager(page, totalPages) {
  const el = document.getElementById('session-pager');
  if (!el) return;
  if (totalPages <= 1) { el.innerHTML = ''; return; }
  el.innerHTML = '';
  const prev = document.createElement('button');
  prev.className = 'pg-btn';
  prev.textContent = '‹ 上一页';
  prev.disabled = page <= 1;
  prev.onclick = () => { if (currentPage > 1) { currentPage--; renderSessionList(); } };
  const info = document.createElement('span');
  info.className = 'pg-info';
  info.textContent = `第 ${page} / ${totalPages} 页（共 ${sessions.length} 条）`;
  const next = document.createElement('button');
  next.className = 'pg-btn';
  next.textContent = '下一页 ›';
  next.disabled = page >= totalPages;
  next.onclick = () => { if (currentPage < totalPages) { currentPage++; renderSessionList(); } };
  el.appendChild(prev);
  el.appendChild(info);
  el.appendChild(next);
}

function clearDetail() {
  document.getElementById('detail-title').textContent = 'Select a session';
  document.getElementById('detail-meta').textContent = '';
  document.getElementById('conversation').innerHTML = '<div id="empty">No session selected.</div>';
  document.getElementById('export-btn').style.display = 'none';
  currentMsgs = [];
}

function fmtFullTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  if (isNaN(d)) return '';
  const pad = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
    + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
}

function buildExportText(msgs) {
  return msgs.map(m => {
    const stamp = fmtFullTime(m.ts);
    const head = stamp ? '[' + stamp + '] ' : '';
    const role = m.role || 'user';
    if (role === 'tool') {
      const lines = [head + '→ ' + (m.tool || '(tool)')];
      if (m.input != null && m.input !== '') {
        const firstLine = m.input.split('\n')[0].trim();
        lines.push('  ' + (firstLine.length > 100 ? firstLine.slice(0, 100) + '…' : firstLine));
      }
      return lines.join('\n');
    }
    const label = role === 'user' ? 'User' : (role === 'assistant' ? agentLabel() : role);
    return head + label + '\n' + (m.text || '');
  }).join('\n\n') + '\n';
}

async function exportConversation() {
  if (!selectedId || !currentMsgs.length) { toast('Nothing to export'); return; }
  const text = buildExportText(currentMsgs);
  const url = (currentTab === 'codex' ? '/api/codex/sessions/' : '/api/sessions2/')
    + encodeURIComponent(selectedId) + '/export';
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: text,
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) {
      toast('Export failed: ' + (j.error || ('HTTP ' + r.status)));
      return;
    }
    toast('Exported to ' + j.path);
  } catch (e) {
    toast('Export failed: ' + e.message);
  }
}

function msgHTML(m) {
  const role = m.role || 'user';
  if (role === 'tool') {
    const hasOutput = m.output != null && m.output !== '';
    const errClass = m.is_error ? ' error' : '';
    const toolName = escapeHTML(m.tool || '(tool)');
    // One-line preview: tool name + truncated input
    let preview = '';
    if (m.input) {
      const firstLine = m.input.split('\n')[0].trim();
      preview = firstLine.length > 80 ? firstLine.slice(0, 80) + '…' : firstLine;
    }
    return `
      <div class="msg tool">
        <div class="tool-card">
          <div class="tool-head">
            <span class="tool-name">${toolName}</span>
            <span class="tool-preview">${escapeHTML(preview)}</span>
            <span class="tool-arrow">▶</span>
          </div>
          <div class="tool-body">
            ${m.input ? `<div class="tool-section">
              <div class="tool-section-label">input</div>
              <div class="tool-content">${escapeHTML(m.input)}</div>
            </div>` : ''}
            ${hasOutput ? `<div class="tool-section">
              <div class="tool-section-label">output${m.is_error ? ' (error)' : ''}</div>
              <div class="tool-content${errClass}">${escapeHTML(m.output)}</div>
            </div>` : '<div class="tool-section"><div class="tool-section-label">no output yet</div></div>'}
          </div>
        </div>
        <div class="ts">${escapeHTML(fmtTime(m.ts))}</div>
      </div>`;
  }
  const labelClass = role === 'user' ? 'user-label' : (role === 'assistant' ? 'assistant-label' : '');
  const label = role === 'user' ? 'User' : (role === 'assistant' ? agentLabel() : role);
  return `
    <div class="msg ${escapeHTML(role)}">
      <div class="role-label ${labelClass}">${escapeHTML(label)}</div>
      <div class="bubble">${escapeHTML(m.text || '')}</div>
      <div class="ts">${escapeHTML(fmtTime(m.ts))}</div>
    </div>`;
}

async function selectSession(id) {
  selectedId = id;
  renderSessionList();
  const s = sessions.find(x => x.session_id === id);
  document.getElementById('detail-title').textContent = (s && (s.thread_name || s.project_name)) || id;
  document.getElementById('detail-meta').textContent = (s && s.cwd) || '';
  const exportBtn = document.getElementById('export-btn');
  exportBtn.style.display = 'none';
  currentMsgs = [];
  const conv = document.getElementById('conversation');
  conv.innerHTML = '<div id="empty">Loading…</div>';
  try {
    const r = await fetch((currentTab === 'codex' ? '/api/codex/sessions/' : '/api/sessions2/') + encodeURIComponent(id));
    if (!r.ok) { conv.innerHTML = '<div id="empty">Failed to load conversation.</div>'; return; }
    const msgs = await r.json();
    currentMsgs = msgs;
    if (!msgs.length) { conv.innerHTML = '<div id="empty">(empty transcript)</div>'; exportBtn.style.display = 'none'; return; }
    conv.innerHTML = msgs.map(msgHTML).join('');
    conv.querySelectorAll('.tool-head').forEach(h => {
      h.addEventListener('click', () => h.closest('.tool-card').classList.toggle('expanded'));
    });
    conv.scrollTop = conv.scrollHeight;
    exportBtn.style.display = '';
  } catch (_) {
    conv.innerHTML = '<div id="empty">Failed to load conversation.</div>';
  }
}

// ── Activity Heatmap ──
async function loadHeatmap() {
  try {
    const resp = await fetch('/api/workspace');
    if (!resp.ok) return;
    const data = await resp.json();
    if (!data || !data.projects) return;

    // Aggregate messages by date
    const dayMap = {};
    let totalMsgs = 0;
    for (const p of Object.values(data.projects)) {
      for (const s of Object.values(p.analyzed_sessions || {})) {
        const ts = s.ts || '';
        if (!ts) continue;
        const date = ts.slice(0, 10); // YYYY-MM-DD
        const count = s.msg_count || 0;
        dayMap[date] = (dayMap[date] || 0) + count;
        totalMsgs += count;
      }
    }

    // Build heatmap: 16 weeks back from today
    const today = new Date();
    const endDate = new Date(today);
    endDate.setHours(0, 0, 0, 0);
    const startDate = new Date(endDate);
    startDate.setDate(startDate.getDate() - 15 * 7 - endDate.getDay()); // go back to include full 16 weeks

    // Find max for normalization
    const counts = Object.values(dayMap);
    const maxCount = counts.length ? Math.max(...counts) : 1;

    // Build columns (weeks)
    const grid = document.getElementById('heatmap-grid');
    const tooltip = document.getElementById('hm-tooltip');
    grid.innerHTML = '';

    const d = new Date(startDate);
    let prevMonth = -1;
    while (d <= endDate) {
      const col = document.createElement('div');
      col.className = 'hm-col';

      // Month label on first week of each month
      if (d.getMonth() !== prevMonth && d.getDate() <= 7) {
        const monthLabel = document.createElement('div');
        monthLabel.className = 'hm-month';
        monthLabel.textContent = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
        monthLabel.style.height = '13px';
        col.appendChild(monthLabel);
        prevMonth = d.getMonth();
      } else {
        const spacer = document.createElement('div');
        spacer.style.height = '13px';
        col.appendChild(spacer);
      }

      // 7 days per column
      for (let dow = 0; dow < 7; dow++) {
        const cellDate = new Date(d);
        cellDate.setDate(cellDate.getDate() + dow);
        if (cellDate > endDate) {
          const empty = document.createElement('div');
          empty.style.width = '11px';
          empty.style.height = '11px';
          col.appendChild(empty);
          continue;
        }
        const dateStr = cellDate.toISOString().slice(0, 10);
        const count = dayMap[dateStr] || 0;
        const level = count === 0 ? 0 : count <= maxCount * 0.25 ? 1 : count <= maxCount * 0.5 ? 2 : count <= maxCount * 0.75 ? 3 : 4;

        const cell = document.createElement('div');
        cell.className = `hm-cell hm-l${level}`;
        const dayNames = ['日','一','二','三','四','五','六'];
        const displayDate = `${cellDate.getMonth()+1}月${cellDate.getDate()}日 周${dayNames[cellDate.getDay()]}`;
        cell.setAttribute('data-tip', `${displayDate}: ${count} 条消息`);
        cell.addEventListener('mouseenter', (e) => {
          tooltip.textContent = e.target.getAttribute('data-tip');
          tooltip.style.display = 'block';
          const r = e.target.getBoundingClientRect();
          tooltip.style.left = r.left + 'px';
          tooltip.style.top = (r.top - 28) + 'px';
        });
        cell.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
        col.appendChild(cell);
      }
      grid.appendChild(col);
      d.setDate(d.getDate() + 7);
    }

    // Total
    document.getElementById('heatmap-total').textContent = `${totalMsgs.toLocaleString()} 条消息`;
  } catch (err) {
    console.error('Heatmap load error:', err);
  }
}

loadHeatmap();

// ── Session search ──
let searchTimer = null;
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const srList = document.getElementById('sr-list');
const srCount = document.getElementById('sr-count');

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (!q) { clearSearch(); return; }
  searchTimer = setTimeout(() => doSearch(q), 300);
});

searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { clearSearch(); searchInput.blur(); }
});

async function doSearch(q) {
  srList.innerHTML = '<div style="padding:8px 12px;color:var(--muted);font-size:12px">搜索中...</div>';
  searchResults.classList.add('visible');
  try {
    const resp = await fetch(`/api/sessions2/search?q=${encodeURIComponent(q)}&limit=15`);
    const results = await resp.json();
    if (!results.length) {
      srList.innerHTML = '<div style="padding:8px 12px;color:var(--muted);font-size:12px">没有匹配的 session</div>';
      srCount.textContent = '0 结果';
      return;
    }
    srCount.textContent = `${results.length} 个匹配`;
    srList.innerHTML = '';
    for (const r of results) {
      const item = document.createElement('div');
      item.className = 'sr-item';
      const snippet = r.matches[0] ? highlightMatch(r.matches[0].snippet, q) : '';
      const more = r.match_count > 1 ? `<span style="color:var(--muted);font-size:11px"> +${r.match_count - 1} 处匹配</span>` : '';
      item.innerHTML = `
        <div class="sr-proj">${escapeHTML(r.project_name)} · ${r.session_id.slice(0,8)}</div>
        <div class="sr-snippet">${snippet}${more}</div>
        <div class="sr-actions">
          <button class="sr-open" onclick="launchSession('${r.session_id}', this)">打开</button>
        </div>`;
      srList.appendChild(item);
    }
  } catch (err) {
    srList.innerHTML = `<div style="padding:8px 12px;color:var(--red);font-size:12px">搜索失败: ${err.message}</div>`;
  }
}

function highlightMatch(text, query) {
  const escaped = escapeHTML(text);
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return escaped.replace(re, '<mark>$1</mark>');
}

function clearSearch() {
  searchResults.classList.remove('visible');
  srList.innerHTML = '';
  searchInput.value = '';
}

async function launchSession(sessionId, btn) {
  btn.disabled = true;
  btn.textContent = '打开中...';
  try {
    const resp = await fetch(`/api/sessions2/launch/${sessionId}`, { method: 'POST' });
    const data = await resp.json();
    if (data.ok) {
      btn.textContent = '已打开';
      btn.style.borderColor = 'var(--muted)';
      btn.style.color = 'var(--muted)';
    } else {
      btn.textContent = '失败';
      btn.disabled = false;
    }
  } catch (err) {
    btn.textContent = '失败';
    btn.disabled = false;
  }
}

function escapeHTML(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function refreshSessions() {
  try {
    const url = currentTab === "codex" ? '/api/codex/sessions' : '/api/sessions2';
    const r = await fetch(url);
    sessions = await r.json();
    renderSessionList();
  } catch (_) {}
}

function connectSSE() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource('/events/stream');
  evtSource.onmessage = () => {
    if (currentTab !== 'claude') return;
    refreshSessions().then(() => {
      if (selectedId) {
        const stillThere = sessions.find(s => s.session_id === selectedId);
        if (stillThere) selectSession(selectedId);
      }
    });
  };
  evtSource.onopen = () => {
    document.getElementById('banner').style.display = 'none';
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  };
  evtSource.onerror = () => {
    document.getElementById('banner').style.display = 'block';
    evtSource.close();
    if (!reconnectTimer) reconnectTimer = setTimeout(connectSSE, 3000);
  };
}

refreshSessions().then(() => {
  connectSSE();
});

// ── Session repair (non-text block stripping) ──
let repairState = null;  // { sessionId, mtime, counts, totalBytes, sample }

function openRepairModal(sessionId) {
  repairState = { sessionId, mtime: null, counts: null, totalBytes: 0, sample: [] };
  const modal = document.getElementById('repair-modal');
  document.getElementById('repair-modal-body').textContent = '加载中…';
  document.getElementById('repair-confirm').disabled = true;
  document.getElementById('repair-confirm').textContent = '确认清理';
  modal.style.display = 'flex';
  fetchRepairPreview();
}

function closeRepairModal() {
  document.getElementById('repair-modal').style.display = 'none';
  repairState = null;
}

async function fetchRepairPreview() {
  const body = document.getElementById('repair-modal-body');
  const confirmBtn = document.getElementById('repair-confirm');
  // Fresh preview: clear any stale re-preview flag.
  repairState.needsRePreview = false;
  try {
    const r = await fetch(`/api/sessions2/${encodeURIComponent(repairState.sessionId)}/repair/preview`);
    const j = await r.json();
    if (!r.ok) {
      body.innerHTML = `<span style="color: var(--red)">预览失败: ${escapeHTML(j.error || ('HTTP ' + r.status))}</span>`;
      confirmBtn.disabled = true;
      return;
    }
    repairState.mtime = j.mtime;
    repairState.counts = j.counts;
    repairState.totalBytes = j.total_bytes;
    const c = j.counts;
    const kb = Math.round(j.total_bytes / 1024);
    body.innerHTML = `
      将删除 <code>${c.document}</code> 个 <code>document</code> 块、
      <code>${c.image}</code> 个 <code>image</code> 块、
      <code>${c.other_unknown}</code> 个未知块（共 ~${kb} KB）。<br>
      原文件备份到 <code>${escapeHTML(repairState.sessionId)}.jsonl.bak</code>（已存在则滚动为 <code>.bak.1.&lt;ts&gt;</code>）。<br>
      <span style="color: var(--yellow)">⚠️ 该会话可能仍在被 Claude 写入。开始前请暂停 Claude 端。</span>
    `;
    confirmBtn.disabled = false;
  } catch (err) {
    body.innerHTML = `<span style="color: var(--red)">预览失败: ${escapeHTML(err.message)}</span>`;
    confirmBtn.disabled = true;
  }
}

async function confirmRepair() {
  if (!repairState) return;
  const body = document.getElementById('repair-modal-body');
  const confirmBtn = document.getElementById('repair-confirm');
  const cancelBtn = document.getElementById('repair-cancel');
  confirmBtn.disabled = true;
  cancelBtn.disabled = true;
  body.innerHTML = '执行中…';
  try {
    const r = await fetch(`/api/sessions2/${encodeURIComponent(repairState.sessionId)}/repair`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ strip_images: true, mtime: repairState.mtime }),
    });
    const j = await r.json();
    if (r.ok && j.ok) {
      const kb = Math.round((j.replaced_bytes || 0) / 1024);
      toast(`清理了 ${j.replaced_blocks} 块（~${kb} KB），备份到 ${j.backup_path}`);
      closeRepairModal();
      // The SSE onmessage handler refreshes sessions and the selected
      // transcript; no manual refresh needed here.
    } else if (j.error === 'mtime_changed') {
      body.innerHTML = `<span style="color: var(--yellow)">文件已被其他进程修改。请重新预览。</span>`;
      confirmBtn.textContent = '重新预览';
      confirmBtn.disabled = false;
      cancelBtn.disabled = false;
      // Set a flag so the permanent listener knows to re-preview
      // instead of confirming on the next click.
      repairState.needsRePreview = true;
    } else {
      body.innerHTML = `<span style="color: var(--red)">执行失败: ${escapeHTML(j.error || ('HTTP ' + r.status))}</span>`;
      confirmBtn.disabled = false;
      cancelBtn.disabled = false;
    }
  } catch (err) {
    body.innerHTML = `<span style="color: var(--red)">执行失败: ${escapeHTML(err.message)}</span>`;
    confirmBtn.disabled = false;
    cancelBtn.disabled = false;
  }
}

document.getElementById('repair-cancel').addEventListener('click', closeRepairModal);
document.getElementById('repair-confirm').addEventListener('click', async () => {
  if (repairState.needsRePreview) {
    repairState.needsRePreview = false;
    await fetchRepairPreview();
  } else {
    await confirmRepair();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('repair-modal').style.display === 'flex') {
    closeRepairModal();
  }
});

setInterval(() => { if (currentTab === 'claude') refreshSessions(); }, 30000);
</script>
