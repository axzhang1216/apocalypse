<script>
(()=>{const btn=document.getElementById('settingsBtn'),menu=document.getElementById('settingsMenu'),veil=document.getElementById('settingsVeil'),status=document.getElementById('settingsStatus'),scaleValue=document.getElementById('settingsScaleValue');const close=()=>{menu.classList.remove('open');veil.classList.remove('open')};btn?.addEventListener('click',async e=>{e.stopPropagation();const open=!menu.classList.contains('open');menu.classList.toggle('open',open);veil.classList.toggle('open',open);if(open){try{const s=await fetch('/api/settings/status',{cache:'no-store'}).then(r=>r.json());document.getElementById('settingsVersion').textContent=`V${s.version||'—'} · ${String(s.arch||'').toUpperCase()}`}catch{}}});veil.addEventListener('click',close);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu.classList.contains('open'))close()});document.querySelectorAll('[data-ui-scale]').forEach(b=>b.addEventListener('click',()=>{const v=Number(b.dataset.uiScale);localStorage.setItem('apocalypse.uiScale.v2',String(v));document.querySelectorAll('[data-ui-scale]').forEach(x=>x.classList.toggle('active',x===b));scaleValue.textContent=Math.round(v*100)+'%';status.textContent='UI SCALE SAVED · reload to apply'}));document.getElementById('reinitBtn')?.addEventListener('click',async()=>{status.textContent='LAUNCHING SETUP…';try{const r=await fetch('/api/settings/reinitialize',{method:'POST'}),j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||`HTTP ${r.status}`);status.className='settings-status ok';status.textContent='SETUP WINDOW LAUNCHED'}catch(e){status.className='settings-status err';status.textContent='REINITIALIZE FAILED · '+e.message}})})();

<script>
(()=>{'use strict';const space=document.getElementById('space');if(!space||document.getElementById('workspaceNeural'))return;document.body.classList.add('workspace-v2');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));const fmtDate=v=>{if(!v)return'';try{return new Date(v).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch{return String(v)}};const root=document.createElement('div');root.id='workspaceNeural';root.innerHTML=`<canvas class="nw-network" id="nwNetwork"></canvas><div class="nw-stage" id="nwStage"></div><aside class="nw-inspector" id="nwInspector"><button class="nw-inspector-close" aria-label="Close">×</button><div id="nwInspectorBody"></div></aside><div class="nw-toast" id="nwToast"></div>`;space.appendChild(root);const stage=root.querySelector('#nwStage'),inspector=root.querySelector('#nwInspector'),inspectorBody=root.querySelector('#nwInspectorBody'),toast=root.querySelector('#nwToast');let world=null,projects=[],state={level:0,project:null,module:null,selected:null},searchIndex=[];const MODULES=[{key:'directions',label:'DIRECTIONS',sub:'research / work directions'},{key:'drafts',label:'DRAFTS',sub:'ideas / active discussions'},{key:'knowledge',label:'KNOWLEDGE',sub:'notes / findings / decisions'},{key:'outputs',label:'OUTPUTS',sub:'reports / papers / code'},{key:'patterns',label:'PATTERNS',sub:'correction patterns'}];function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.remove('show'),2200)}function byProject(p){return(world?.objects||[]).filter(o=>o.project_id===p.id)}function projectItems(p,key){const rows=byProject(p),convs=rows.filter(x=>x.type==='conversation').sort((a,b)=>String(b.ts||'').localeCompare(String(a.ts||''))),decisions=rows.filter(x=>x.type==='decision').sort((a,b)=>String(b.ts||'').localeCompare(String(a.ts||'')));if(key==='directions'){const out=[];if(p.goal)out.push({id:'direction:'+p.id,type:'Direction',title:p.goal,copy:p.summary||'',project:p,virtual:true});if(!out.length&&p.summary)out.push({id:'direction:'+p.id,type:'Direction',title:p.summary,copy:'',project:p,virtual:true});return out}if(key==='drafts')return convs.slice(0,8).map(c=>({...c,typeLabel:'Draft',copy:`${c.msg_count||0} messages · ${c.agent||'agent'} · ${c.state||''}`}));if(key==='knowledge'){const out=decisions.slice(0,8).map(d=>({...d,typeLabel:d.decision?'Decision':'Note',copy:d.decision||d.topic||''}));if(p.summary)out.unshift({id:'note:'+p.id,type:'Note',title:'Project summary',copy:p.summary,project:p,virtual:true});return out.slice(0,9)}return[]}function moduleCount(p,key){return projectItems(p,key).length}function chooseMatter(){return[...projects].sort((a,b)=>{const sa=a.status==='active'?3:a.status==='waiting'?2:1,sb=b.status==='active'?3:b.status==='waiting'?2:1;return sb-sa||String(b.last_active||'').localeCompare(String(a.last_active||''))||(b.importance||0)-(a.importance||0)})[0]||null}function jellyNode({cls='nw-project',x=50,y=50,title='',meta='',accent='',attrs=''}){return`<button class="${cls}" ${attrs} style="left:${x}%;top:${y}%;${accent?`--accent:${accent};`:''}"><span class="nw-jelly"><i class="nw-jelly-cap"></i><i class="nw-tentacle t1"></i><i class="nw-tentacle t2"></i><i class="nw-tentacle t3"></i></span><span class="nw-node-title">${esc(title)}</span><span class="nw-node-meta">${esc(meta)}</span></button>`}function searchShell(){return`<div class="nw-search-wrap"><div class="nw-search-shell"><span class="nw-search-icon">⌕</span><input class="nw-search-input" id="nwSearch" autocomplete="off" spellcheck="false" placeholder="Search your workspace — projects, drafts, findings, reports, patterns…"><span class="nw-search-kbd">⌘ K</span><div class="nw-search-results" id="nwSearchResults"></div></div></div>`}function updateTrail(html){const t=document.getElementById('trail');if(t)t h.PI*2;nodes+=jellyNode({x:cx+Math.cos(a)*rx,y:cy+Math.sin(a)*ry,title:p.name||p.title,meta:`${p.sessions||0} sessions · ${p.status||'idle'}`,accent:p.status==='active'?'#d9c59d':'#b9bdc6',attrs:`data-project="${esc(p.id)}"`})});if(projects.length>9)nodes+=jellyNode({cls:'nw-project more',x:84,y:80,title:`+${projects.length-9} more`,meta:'search to find',attrs:'data-more="1"'});const title=matter?(matter.name||matter.title):'Your workspace is ready',copy=matter?(matter.goal||matter.summary||'Recent work is concentrated here.'):'Connect projects and conversations to let Apocalypse surface what matters now.';stage.innerHTML=searchShell()+`<div class="nw-center"><div class="nw-orb"><i class="orb-core"></i></div><div class="nw-eyebrow">WHAT MATTERS NOW</div><div class="nw-matter-title">${esc(title)}</div><div class="nw-matter-copy">${esc(copy)}</div>${matter?`<div class="nw-matter-meta"><span>${esc(matter.status||'idle')}</span><span>${matter.sessions||0} sessions</span><span>${matter.decisions||0} decisions</span></div>`:''}</div><div class="nw-project-layer">${nodes}</div>`;stage.querySelectorAll('[data-project]').forEach(b=>b.addEventListener('click',()=>openProject(b.dataset.project)));stage.querySelector('[data-more]')?.addEventListener('click',()=>stage.querySelector('#nwSearch')?.focus());updateTrail('<b>WORKSPACE</b> / cognitive map');buildSearchIndex();bindSearch()}function modulePositions(){return[{x:22,y:33},{x:78,y:33},{x:18,y:69},{x:82,y:69},{x:50,y:82}]}function openProject(id){const p=projects.find(x=>x.id===id);if(!p)return;state={level:1,project:p,module:null,selected:null};inspector.classList.remove('open');const pos=modulePositions();let mods='';MODULES.forEach((m,i)=>mods+=jellyNode({cls:'nw-module',x:pos[i].x,y:pos[i].y,title:m.label,meta:`${moduleCount(p,m.key)} · ${m.sub}`,attrs:`data-module="${m.key}"`}));stage.innerHTML=`<div class="nw-breadcrumb"><button data-home>WORKSPACE</button><i></i><span>${esc(p.name||p.title)}</span></div><div class="nw-project-center"><div class="nw-orb"><i class="orb-core"></i></div><div class="nw-eyebrow">PROJECT</div><div class="nw-project-name">${esc(p.name||p.title)}</div><div class="nw-project-goal">${esc(p.goal||p.summary||'')}</div><div class="nw-project-stats"><span>${p.sessions||0} sessions</span><span>${p.decisions||0} decisions</span><span>${esc(p.status||'idle')}</span></div></div><div class="nw-module-layer">${mods}</div>`;stage.querySelector('[data-home]')?.addEventListener('click',renderLevel0);stage.querySelectorAll('[data-module]').forEach(b=>b.addEventListener('click',()=>openModule(b.dataset.module)));stage.querySelector('.nw-project-center')?.addEventListener('click',()=>showInspector(p,'Project'));updateTrail(`<b>WORKSPACE</b> / <b>${esc(p.name||p.title)}</b>`);buildSearchIndex()}function fanLayout(n){const out=[],left=state.module==='directions'||state.module==='drafts'||state.module==='patterns',baseX=left?37:63;if(n<=1)return[{x:baseX,y:51}];for(let i=0;i<n;i++)out.push({x:baseX+(left?-1:1)*(i%2)*4,y:28+47*(i/(n-1))});return out}function openModule(key){const p=state.project;if(!p)return;state.level=2;state.module=key;state.selected=null;inspector.classList.remove('open');const m=MODULES.find(x=>x.key===key),items=projectItems(p,key),pos=modulePositions()[MODULES.findIndex(x=>x.key===key)],fan=fanLayout(Math.max(1,items.length));let cards='';if(items.length)items.forEach((it,i)=>cards+=`<button class="nw-fan-item" data-item="${esc(it.id)}" style="left:${fan[i].x}%;top:${fan[i].y}%"><div class="type">${esc(it.typeLabel||it.type||'Note')}</div><div class="title">${esc(it.title||it.name||it.topic||'Untitled')}</div><div class="sub">${esc(it.copy||it.summary||fmtDate(it.ts)||'')}</div></button>`);else cards=`<div class="nw-fan-item empty" style="left:${fan[0].x}%;top:${fan[0].y}%"><div class="type">${esc(m.label)}</div><div class="title">Waiting for Knowledge IR</div><div class="sub">No persisted ${esc(m.label.toLowerCase())} nodes yet</div></div>`;stage.innerHTML=`<div class="nw-breadcrumb"><button data-home>WORKSPACE</button><i></i><button data-project-back>${esc(p.name||p.title)}</button><i></i><span>${esc(m.label)}</span></div><div class="nw-project-center" style="left:${pos.x}%;top:${pos.y}%"><div class="nw-orb" style="width:108px;height:108px"><i class="orb-core"></i></div><div class="nw-eyebrow">${esc(m.label)}</div><div class="nw-project-name" style="font-size:24px">${esc(p.name||p.title)}</div><div class="nw-project-goal">${esc(m.sub)}</div></div><div class="nw-fan"><svg class="nw-fan-lines" id="nwFanLines"></svg><div class="nw-fan-items">${cards}</div></div>`;stage.querySelector('[data-home]')?.addEventListener('click',renderLevel0);stage.querySelector('[data-project-back]')?.addEventListener('click',()=>openProject(p.id));stage.querySelectorAll('[data-item]').forEach(b=>b.addEventListener('click',()=>{const it=items.find(x=>String(x.id)===b.dataset.item);if(it)showInspector(it,it.typeLabel||it.type||m.label)}));requestAnimationFrame(()=>drawFanLines(pos,fan,items.length));updateTrail(`<b>WORKSPACE</b> / <b>${esc(p.name||p.title)}</b> / ${esc(m.label)}`);buildSearchIndex()}function drawFanLines(source,positions,count){const svg=stage.querySelector('#nwFanLines');if(!svg)return;const W=root.clientWidth,H=root.clientHeight,sx=W*source.x/100,sy=H*source.y/100,n=Math.max(1,count);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.innerHTML=positions.slice(0,n).map((p,i)=>{const x=W*p.x/100,y=H*p.y/100,cx=(sx+x)/2+(i%2?18:-18);return`<path d="M ${sx.toFixed(1)} ${sy.toFixed(1)} Q ${cx.toFixed(1)} ${((sy+y)/2).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)}"/>`}).join('')}function sourceRows(o){const rows=[];if(o.project_id||o.project)rows.push(['Project',o.project?.name||o.project?.title||projects.find(p=>p.id===o.project_id)?.name||'']);if(o.session_id)rows.push(['Session',o.session_id]);if(o.conversation_id)rows.push(['Conversation',o.conversation_id]);if(o.agent)rows.push(['Agent',o.agent]);if(o.cwd)rows.push(['Project nspectorBody.querySelector('[data-copy-path]')?.addEventListener('click',async e=>{try{await navigator.clipboard.writeText(e.currentTarget.dataset.copyPath);notify('PROJECT PATH COPIED')}catch{notify(e.currentTarget.dataset.copyPath)}})}async function openConversation(cid){try{const r=await fetch('/api/conversations/'+encodeURIComponent(cid),{cache:'no-store'});if(!r.ok)throw new Error('conversation unavailable');const c=await r.json(),msgs=(c.messages||[]).filter(m=>m.role==='user'||(m.role==='assistant'&&m.conclusion)).slice(-8);inspectorBody.insertAdjacentHTML('beforeend',`<div class="nw-rule"></div><div class="nw-section-label">CONVERSATION</div><div class="nw-source-list">${msgs.map(m=>`<div class="nw-source"><b>${esc(m.role==='user'?'USER':'CONCLUSION')}</b>${esc(m.text||'')}</div>`).join('')||'<div class="nw-source">No compact messages available.</div>'}</div>`)}catch(e){notify(e.message)}}async function resumeSession(sid){try{const r=await fetch('/api/sessions2/launch/'+encodeURIComponent(sid),{method:'POST'}),j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||'resume failed');notify('SESSION LAUNCHED')}catch(e){notify('RESUME FAILED · '+e.message)}}inspector.querySelector('.nw-inspector-close')?.addEventListener('click',()=>inspector.classList.remove('open'));function currentSpace(){return!document.getElementById('space')?.classList.contains('hidden')}document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&currentSpace()){e.preventDefault();if(state.level!==0)renderLevel0();setTimeout(()=>stage.querySelector('#nwSearch')?.focus(),20);return}if(e.key==='Escape'&&currentSpace()){if(inspector.classList.contains('open')){inspector.classList.remove('open');return}if(state.level===2){openProject(state.project.id);return}if(state.level===1)renderLevel0()}});document.getElementById('searchBtn')?.addEventListener('click',e=>{if(!currentSpace())return;e.preventDefault();e.stopImmediatePropagation();if(state.level!==
