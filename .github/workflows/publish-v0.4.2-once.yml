name: One-shot publish v0.4.2

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download x64 installer
        uses: actions/download-artifact@v4
        with:
          name: Apocalypse-Setup-x64
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38534253993
      - name: Download x86 installer
        uses: actions/download-artifact@v4
        with:
          name: Apocalypse-Setup-x86
          path: release-assets
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38534253993
      - name: Create checksums
        run: |
          cd release-assets
          sha256sum Apocalypse-Setup-x64.exe Apocalypse-Setup-x86.exe > SHA256SUMS.txt
      - name: Publish v0.4.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Apocalypse v0.4.2

          - new cognitive SPACE workspace with WHAT MATTERS NOW and large workspace search
          - Project view reorganized into Directions, Drafts, Knowledge, Outputs and Patterns
          - Session / Conversation / Agent details moved behind provenance with resume support
          - keeps existing OPS, live conversation watcher and local runtime features
          - x64 and native x86 installers
          EOF
          gh release create v0.4.2 release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target 0d5f674225f995f133279eb19acdd84eda8087ec \
            --title "Apocalypse v0.4.2" \
            --notes-file release-notes.md \
            --latest
