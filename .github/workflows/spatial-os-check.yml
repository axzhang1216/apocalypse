name: Spatial OS checks

on:
  push:
    branches: [main]
    paths:
      - 'skills_apocalypse/**'
      - '.github/workflows/spatial-os-check.yml'
  pull_request:
    paths:
      - 'skills_apocalypse/**'
      - '.github/workflows/spatial-os-check.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: |
          python -m py_compile \
            skills_apocalypse/backend/server.py \
            skills_apocalypse/backend/spatial_server.py \
            skills_apocalypse/backend/spatial_server_plus.py \
            skills_apocalypse/backend/apocalypse_ui.py \
            skills_apocalypse/backend/agent_discovery.py \
            skills_apocalypse/backend/onboarding.py \
            skills_apocalypse/backend/analysis_harness.py \
            skills_apocalypse/backend/ops_analysis.py \
            skills_apocalypse/backend/quota_adapters.py \
            skills_apocalypse/backend/grok_quota.py \
            skills_apocalypse/backend/volc_quota.py \
            skills_apocalypse/backend/chat_archive.py \
            skills_apocalypse/backend/feishu_sync.py \
            skills_apocalypse/backend/repair.py \
            skills_apocalypse/backend/app_lifecycle.py \
            skills_apocalypse/backend/anthropic.py \
            skills_apocalypse/pipeline/clean_pipeline.py \
            skills_apocalypse/pipeline/clean_session.py \
            skills_apocalypse/pipeline/extract_knowledge_ir.py \
            skills_apocalypse/pipeline/full_pipeline.py \
            skills_apocalypse/pipeline/has_meaningful_dialog.py \
            skills_apocalypse/pipeline/knowledge_viewer.py \
            skills_apocalypse/pipeline/segment_pipeline.py \
            skills_apocalypse/pipeline/segment_session.py \
            skills_apocalypse/pipeline/transcripts.py
      - name: Discovery smoke test
        run: PYTHONPATH=skills_apocalypse/backend python skills_apocalypse/backend/agent_discovery.py > /tmp/apocalypse-discovery.json
      - name: Spatial bridge tests
        run: python -m unittest skills_apocalypse.tests.test_spatial_server
      - name: JavaScript syntax
        run: |
          node --check skills_apocalypse/frontend/spatial_os.js
          node --check skills_apocalypse/frontend/onboarding_ui.js
          node --check skills_apocalypse/frontend/ops_polish.js
      - name: Shell syntax
        run: bash -n skills_apocalypse/install.sh skills_apocalypse/apocalypse-ui
