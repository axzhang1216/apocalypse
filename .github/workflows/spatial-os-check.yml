name: Spatial OS checks

on:
  push:
    branches: [main]
    paths:
      - 'skills_apocalypse/**'
      - '.github/workflows/spatial-os-check.yml'
  pull_request:
    paths:
      - 'skills_apocalypse/**'
      - '.github/workflows/spatial-os-check.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: |
          python -m py_compile \
            skills_apocalypse/server.py \
            skills_apocalypse/spatial_server.py \
            skills_apocalypse/spatial_server_plus.py \
            skills_apocalypse/apocalypse_ui.py \
            skills_apocalypse/agent_discovery.py \
            skills_apocalypse/onboarding.py \
            skills_apocalypse/analysis_harness.py \
            skills_apocalypse/ops_analysis.py \
            skills_apocalypse/quota_adapters.py \
            skills_apocalypse/app_lifecycle.py \
            skills_apocalypse/anthropic.py
      - name: Discovery smoke test
        run: PYTHONPATH=skills_apocalypse python skills_apocalypse/agent_discovery.py > /tmp/apocalypse-discovery.json
      - name: Spatial bridge tests
        run: python -m unittest skills_apocalypse.tests.test_spatial_server
      - name: JavaScript syntax
        run: |
          node --check skills_apocalypse/spatial_os.js
          node --check skills_apocalypse/onboarding_ui.js
          node --check skills_apocalypse/ops_polish.js
      - name: Shell syntax
        run: bash -n skills_apocalypse/install.sh skills_apocalypse/apocalypse-ui
