name: Windows desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: v0.2.0
  APP_VERSION: 0.2.0

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            python_arch: x64
            expected_bits: '64'
            pe_machine: '8664'
          - arch: x86
            python_arch: x86
            expected_bits: '32'
            pe_machine: '014c'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python_arch }}
      - name: Verify Python architecture
        shell: pwsh
        env:
          EXPECTED_BITS: ${{ matrix.expected_bits }}
        run: python -c "import os, struct; bits=str(struct.calcsize('P')*8); print('Python bits:', bits); assert bits == os.environ['EXPECTED_BITS']"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r skills_apocalypse/desktop-requirements.txt
          choco install innosetup -y --no-progress

      - name: Build desktop executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name Apocalypse `
            --collect-all webview `
            --hidden-import clr `
            --hidden-import anthropic `
            --hidden-import app_lifecycle `
            --add-data "skills_apocalypse/spatial_os.html;." `
            --add-data "skills_apocalypse/spatial_os.css;." `
            --add-data "skills_apocalypse/spatial_os.js;." `
            --add-data "skills_apocalypse/dashboard.html;." `
            skills_apocalypse/desktop_app.py

          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name ApocalypseSetup `
            skills_apocalypse/setup_wizard.py

      - name: Verify executable architecture
        shell: pwsh
        env:
          EXPECTED_MACHINE: ${{ matrix.pe_machine }}
        run: |
          foreach ($name in @('Apocalypse.exe','ApocalypseSetup.exe')) {
            $path = Resolve-Path (Join-Path 'dist' $name)
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$name missing MZ PE header" }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            $expected = [Convert]::ToUInt16($env:EXPECTED_MACHINE, 16)
            Write-Host ("$name PE machine: 0x{0:X4}" -f $machine)
            if ($machine -ne $expected) { throw "$name has wrong PE architecture" }
            if ((Get-Item $path).Length -lt 1000000) { throw "$name is unexpectedly small" }
          }

      - name: Build installer
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exePath = (Resolve-Path 'dist/Apocalypse.exe').Path
          $setupExePath = (Resolve-Path 'dist/ApocalypseSetup.exe').Path
          $outputDir = Join-Path $PWD 'installer-dist'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $issPath = Join-Path $PWD "Apocalypse-$env:BUILD_ARCH.iss"
          $lines = @(
            '[Setup]',
            'AppId={{4D4A62DD-586F-471A-8B99-6B18C0596501}',
            'AppName=Apocalypse',
            "AppVersion=$env:APP_VERSION",
            'AppPublisher=Aoxing Zhang',
            'AppPublisherURL=https://github.com/axzhang1216/apocalypse',
            'AppSupportURL=https://github.com/axzhang1216/apocalypse/issues',
            'AppUpdatesURL=https://github.com/axzhang1216/apocalypse/releases',
            'DefaultDirName={autopf}\Apocalypse',
            'DefaultGroupName=Apocalypse',
            'DisableProgramGroupPage=yes',
            'UninstallDisplayIcon={app}\Apocalypse.exe',
            "OutputDir=$outputDir",
            "OutputBaseFilename=Apocalypse-Setup-$env:BUILD_ARCH",
            'Compression=lzma2',
            'SolidCompression=yes',
            'WizardStyle=modern',
            'PrivilegesRequired=admin',
            'CloseApplications=yes',
            'RestartApplications=no'
          )
          if ($env:BUILD_ARCH -eq 'x64') {
            $lines += 'ArchitecturesAllowed=x64compatible'
            $lines += 'ArchitecturesInstallIn64BitMode=x64compatible'
          } else { $lines += 'ArchitecturesAllowed=x86compatible' }
          $lines += @(
            '', '[Tasks]',
            'Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional shortcuts:"; Flags: unchecked',
            '', '[Files]',
            "Source: `"$exePath`"; DestDir: `"{app}`"; Flags: ignoreversion",
            "Source: `"$setupExePath`"; DestDir: `"{app}`"; Flags: ignoreversion",
            '', '[Icons]',
            'Name: "{group}\Apocalypse"; Filename: "{app}\Apocalypse.exe"',
            'Name: "{group}\Configure Apocalypse"; Filename: "{app}\ApocalypseSetup.exe"',
            'Name: "{autodesktop}\Apocalypse"; Filename: "{app}\Apocalypse.exe"; Tasks: desktopicon',
            '', '[Run]',
            'Filename: "{app}\ApocalypseSetup.exe"; Description: "Discover agents, choose Plan usage and analysis model"; Flags: postinstall skipifsilent',
            'Filename: "{app}\Apocalypse.exe"; Description: "Launch Apocalypse"; Flags: nowait postinstall skipifsilent'
          )
          $lines | Set-Content -Path $issPath -Encoding UTF8
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = Join-Path $outputDir "Apocalypse-Setup-$env:BUILD_ARCH.exe"
          if (-not (Test-Path $setup)) { throw 'Installer was not created' }

      - name: Smoke-test silent install
        shell: pwsh
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          $setup = (Resolve-Path "installer-dist/Apocalypse-Setup-$env:BUILD_ARCH.exe").Path
          $target = Join-Path $env:RUNNER_TEMP "Apocalypse-$env:BUILD_ARCH-test"
          $proc = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Silent installer test failed: $($proc.ExitCode)" }
          foreach ($name in @('Apocalypse.exe','ApocalypseSetup.exe')) {
            if (-not (Test-Path (Join-Path $target $name))) { throw "$name not found after install" }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Apocalypse-Setup-${{ matrix.arch }}
          path: installer-dist/Apocalypse-Setup-${{ matrix.arch }}.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Apocalypse-Setup-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum Apocalypse-Setup-x64.exe Apocalypse-Setup-x86.exe > SHA256SUMS.txt
      - name: Create release
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Apocalypse v0.2.0

          - Settings menu with UI scale, reinitialize, and self-update
          - first-run Agent / Provider / model discovery
          - Apocalypse-owned analysis harness and cached OPS analysis
          - real personal Plan quota adapters
          - Claude Session maintenance: CLEAN NON-TEXT and REPAIR JSONL
          - SPACE outer-click navigation back to all Projects
          - x64 and native x86 Windows installers

          The Windows app includes **Configure Apocalypse** and can now check GitHub Releases from Settings, download the matching installer architecture, and launch the updater.

          These installers are unsigned, so Windows SmartScreen may warn on first launch.
          EOF
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_VERSION" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Apocalypse $RELEASE_VERSION" --notes-file release-notes.md --latest
          fi
